<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>لوحة إدارة دليل الحاج</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* =================================================================
           إعدادات عامة - بدون شريط جانبي
        ================================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', system-ui, sans-serif; }
        :root { --primary: #075c52; --primary-dark: #043d36; --bg: #f4f7fc; --card-bg: #ffffff; --text: #1a2e35; --text-muted: #718096; --shadow: 0 4px 12px rgba(0,0,0,0.05); --radius: 16px; --gold: #c99625; --google-red: #ea4335; }
        body { background: var(--bg); color: var(--text); padding: 0; }

        /* =================================================================
           الشريط العلوي (بدلاً من الجانبي)
        ================================================================= */
        .topbar {
            background: var(--primary-dark);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            flex-wrap: wrap;
            gap: 8px;
        }
        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }
        .topbar .brand i { font-size: 24px; color: var(--gold); }
        .topbar .brand span { font-size: 18px; font-weight: 800; }
        .topbar .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-sm {
            padding: 8px 14px;
            border-radius: 60px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-sm.white { background: #ffffff22; color: #fff; border: 1px solid #ffffff33; }
        .btn-sm.white:hover { background: #ffffff44; }
        .btn-sm.primary { background: var(--gold); color: #fff; }
        .btn-sm.primary:hover { background: #b8860b; transform: scale(1.02); }
        .btn-sm.outline { background: transparent; border: 1px solid #e2e8f0; color: var(--text); }
        .btn-sm.outline:hover { background: #f7fafc; }

        /* =================================================================
           المحتوى الرئيسي (كامل العرض)
        ================================================================= */
        .main-content { padding: 16px; max-width: 1200px; margin: 0 auto; }

        /* =================================================================
           بطاقات الإحصائيات
        ================================================================= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-right: 4px solid var(--primary);
        }
        .stat-card .label { font-size: 12px; color: var(--text-muted); }
        .stat-card .value { font-size: 26px; font-weight: 800; margin: 2px 0; }
        .stat-card.gold { border-right-color: var(--gold); }

        /* =================================================================
           شريط الأدوات
        ================================================================= */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 60px;
            padding: 0 14px;
            flex: 1;
            min-width: 160px;
        }
        .search-box i { color: var(--text-muted); margin-left: 8px; }
        .search-box input {
            border: none;
            background: transparent;
            padding: 10px 0;
            width: 100%;
            font-size: 14px;
            outline: none;
        }
        .left-actions { display: flex; gap: 8px; }

        /* =================================================================
           عرض البطاقات (Card View) - الأساسي الآن
        ================================================================= */
        .pilgrim-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .pilgrim-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.2s;
            border-right: 4px solid transparent;
        }
        .pilgrim-card.has-location { border-right-color: var(--gold); }
        .pilgrim-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .pilgrim-card .name-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pilgrim-card .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }
        .pilgrim-card .name { font-weight: 700; font-size: 16px; }
        .pilgrim-card .code { font-family: monospace; background: var(--bg); padding: 2px 8px; border-radius: 6px; font-size: 13px; }
        .pilgrim-card .detail { font-size: 13px; color: var(--text-muted); }
        .pilgrim-card .detail i { width: 18px; color: var(--primary); }
        .pilgrim-card .status-badge {
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .status-badge.active { background: #c6f6d5; color: #276749; }
        .status-badge.inactive { background: #edf2f7; color: #4a5568; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.green { background: #48bb78; }
        .status-dot.gray { background: #a0aec0; }
        .pilgrim-card .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .pilgrim-card .actions button {
            border: none;
            padding: 8px 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            color: var(--text);
        }
        .pilgrim-card .actions .loc-btn { background: #ebf8ff; color: #2b6cb0; }
        .pilgrim-card .actions .edit-btn { background: #fefcbf; color: #d69e2e; }
        .pilgrim-card .actions .del-btn { background: #fed7d7; color: #e53e3e; }
        .pilgrim-card .actions .google-btn { background: #fff; border: 1.5px solid var(--google-red); color: var(--google-red); }
        .pilgrim-card .actions button:active { transform: scale(0.95); }

        /* =================================================================
           المودالات (كما هي لكن أفضل)
        ================================================================= */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; padding: 16px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--card-bg); border-radius: 24px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; animation: modalIn 0.2s ease; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-box .modal-header h2 { color: var(--primary); font-size: 20px; }
        .modal-box .modal-header .close-modal { background: none; border: none; font-size: 28px; color: var(--text-muted); cursor: pointer; }
        .modal-box .form-group { margin-bottom: 14px; }
        .modal-box .form-group label { display: block; font-weight: 600; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .modal-box .form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: var(--bg); }
        .modal-box .form-group input:focus { border-color: var(--primary); outline: none; background: #fff; }
        .modal-box .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-box .btn-save { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 60px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 8px; }
        .modal-box .btn-save:hover { background: var(--primary-dark); }

        .map-modal .map-header { background: var(--primary-dark); color: #fff; padding: 12px 16px; border-radius: 16px 16px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .map-modal .map-header h2 { font-size: 18px; }
        .map-modal .map-header .close-modal { color: #fff; background: none; border: none; font-size: 24px; }
        .map-toolbar { padding: 10px; background: #f8fafc; display: flex; gap: 8px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
        .map-toolbar .search-input { flex: 1; padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 60px; font-size: 14px; min-width: 120px; }
        .map-toolbar .btn-icon { background: var(--primary); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }
        .map-toolbar .btn-icon.gold { background: var(--gold); }
        #locationMap { height: 280px; width: 100%; }
        .map-footer { padding: 12px 16px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-radius: 0 0 16px 16px; }
        .map-footer .address-info { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex: 1; }
        .map-footer .btn-group { display: flex; gap: 8px; }
        .map-footer .btn-google { background: #fff; border: 1.5px solid var(--google-red); color: var(--google-red); padding: 6px 16px; border-radius: 60px; font-weight: 700; cursor: pointer; }
        .map-footer .btn-google.disabled { opacity: 0.4; pointer-events: none; }
        .map-footer .btn-save-location { background: var(--primary); color: #fff; border: none; padding: 6px 20px; border-radius: 60px; font-weight: 700; cursor: pointer; }

        /* =================================================================
           Toast
        ================================================================= */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 60px; font-weight: 600; font-size: 14px; z-index: 9999; opacity: 0; transition: 0.3s; white-space: nowrap; max-width: 90%; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.error { background: #b91c1c; }

        /* =================================================================
           تحسينات للجوال
        ================================================================= */
        @media (max-width: 600px) {
            .topbar .brand span { font-size: 15px; }
            .btn-sm { font-size: 11px; padding: 6px 10px; }
            .main-content { padding: 10px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card { padding: 10px 12px; }
            .stat-card .value { font-size: 20px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .modal-box { padding: 16px; }
            .modal-box .form-row { grid-template-columns: 1fr; }
            .pilgrim-card .row { flex-direction: column; align-items: stretch; gap: 6px; }
            .pilgrim-card .name-section { justify-content: space-between; }
            .pilgrim-card .actions { justify-content: center; }
            .map-footer { flex-direction: column; }
            .map-footer .btn-group { width: 100%; justify-content: center; }
            #toast { font-size: 12px; padding: 8px 16px; white-space: normal; }
        }
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr; }
            .topbar .actions .btn-sm { font-size: 10px; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <!-- =========================================================
         الشريط العلوي (بديل الشريط الجانبي)
    ========================================================= -->
    <header class="topbar">
        <div class="brand">
            <i class="fas fa-kaaba"></i>
            <span>إدارة الحجاج</span>
        </div>
        <div class="actions">
            <a href="https://hussamhamami8-cmd.github.io/alhaj/" target="_blank" class="btn-sm white">
                <i class="fas fa-external-link-alt"></i> التطبيق
            </a>
            <button class="btn-sm primary" onclick="openAddModal()">
                <i class="fas fa-plus"></i> إضافة
            </button>
            <button class="btn-sm white" onclick="loadPilgrims()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <!-- =========================================================
         المحتوى الرئيسي
    ========================================================= -->
    <main class="main-content" id="adminContent">

        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">إجمالي الحجاج</div>
                <div class="value" id="totalPilgrims">0</div>
            </div>
            <div class="stat-card gold">
                <div class="label">موقع محدد</div>
                <div class="value" id="locatedPilgrims">0</div>
            </div>
            <div class="stat-card">
                <div class="label">آخر إضافة</div>
                <div class="value" id="lastAdded">-</div>
            </div>
        </div>

        <!-- شريط البحث والأدوات -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="بحث بالاسم أو الكود..." onkeyup="filterTable()">
            </div>
            <div class="left-actions">
                <button class="btn-sm outline" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
                <button class="btn-sm outline" onclick="loadPilgrims()" style="border-color:var(--primary);color:var(--primary);">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
            </div>
        </div>

        <!-- عرض البطاقات (بديل الجدول) -->
        <div id="pilgrimGrid" class="pilgrim-grid">
            <div style="text-align:center;padding:40px;color:var(--text-muted);">جاري تحميل البيانات...</div>
        </div>

    </main>

    <!-- =========================================================
         مودال الإضافة / التعديل
    ========================================================= -->
    <div class="modal-overlay" id="addEditModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-user-plus"></i> إضافة حاج</h2>
                <button class="close-modal" onclick="closeModal('addEditModal')">&times;</button>
            </div>
            <input type="hidden" id="editId">
            <div class="form-row">
                <div class="form-group"><label>اسم الحاج</label><input type="text" id="inputName" placeholder="أحمد"></div>
                <div class="form-group"><label>الشفرة</label><input type="text" id="inputCode" placeholder="1234"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>رقم الهاتف</label><input type="text" id="inputPhone" placeholder="0501234567"></div>
                <div class="form-group"><label>الجنسية</label><input type="text" id="inputNationality" placeholder="سعودي"></div>
            </div>
            <div class="form-group"><label>معرف المستخدم (اختياري)</label><input type="text" id="inputUserId" placeholder="اتركه فارغاً"></div>
            <button class="btn-save" onclick="savePilgrim()"><i class="fas fa-save"></i> حفظ البيانات</button>
        </div>
    </div>

    <!-- =========================================================
         مودال الخريطة
    ========================================================= -->
    <div class="modal-overlay" id="locationModal">
        <div class="modal-box map-modal" style="max-width:600px;padding:0;">
            <div class="map-header">
                <h2><i class="fas fa-map-marked-alt"></i> موقع الحاج</h2>
                <button class="close-modal" onclick="closeModal('locationModal')">&times;</button>
            </div>
            <div class="map-toolbar">
                <input type="text" class="search-input" id="mapSearchInput" placeholder="ابحث عن مكان..." onkeydown="if(event.key==='Enter') searchLocation()">
                <button class="btn-icon gold" onclick="searchLocation()"><i class="fas fa-search"></i></button>
            </div>
            <div id="locationMap"></div>
            <div class="map-footer">
                <div class="address-info">
                    <i class="fas fa-location-dot"></i>
                    <span id="selectedAddress">اختر موقعاً على الخريطة</span>
                </div>
                <div class="btn-group">
                    <button class="btn-google" id="googleMapsBtn" onclick="openInGoogleMaps()"><i class="fas fa-map"></i> جوجل مابس</button>
                    <button class="btn-save-location" onclick="saveLocation()"><i class="fas fa-check"></i> حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================================================
         Toast
    ========================================================= -->
    <div id="toast"></div>

    <!-- =========================================================
         المكتبات والكود
    ========================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // =================================================================
        // 1. الإعدادات
        // =================================================================
        const SUPABASE_URL = "https://tmmspfxkmqsivpxchfkk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_e_UeWsqQTEk0GUhdpMDHYg_nAC3b7vZ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allPilgrims = [];
        let currentLocationPilgrimId = null;
        let map = null, marker = null;

        // =================================================================
        // 2. تحميل البيانات وعرضها (بطاقات)
        // =================================================================
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${msg}`;
            t.className = 'show' + (isError ? ' error' : '');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        async function loadPilgrims() {
            const grid = document.getElementById('pilgrimGrid');
            grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';

            try {
                const { data, error } = await supabase.from('pilgrims').select('*').order('id', { ascending: false });
                if (error) throw new Error(error.message);
                allPilgrims = data || [];
                renderCards(allPilgrims);
                updateStats(allPilgrims);
            } catch (e) {
                grid.innerHTML = `<div style="text-align:center;padding:40px;color:#e53e3e;"><i class="fas fa-exclamation-triangle"></i> ${e.message}</div>`;
                showToast('❌ ' + e.message, true);
            }
        }

        function renderCards(list) {
            const grid = document.getElementById('pilgrimGrid');
            if (!list || list.length === 0) {
                grid.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted);">
                    <i class="fas fa-user-slash" style="font-size:40px;display:block;margin-bottom:10px;"></i> لا يوجد حجاج مسجلين
                </div>`;
                return;
            }

            grid.innerHTML = list.map((p, i) => {
                const hasLoc = p.latitude && p.longitude;
                const date = p.created_at ? new Date(p.created_at).toLocaleDateString('ar-SA') : '-';
                const initial = p.name ? p.name.charAt(0) : 'ح';
                return `
                    <div class="pilgrim-card ${hasLoc ? 'has-location' : ''}">
                        <div class="row">
                            <div class="name-section">
                                <div class="avatar">${initial}</div>
                                <span class="name">${esc(p.name)}</span>
                                <span class="code">${esc(p.code)}</span>
                            </div>
                            <span class="status-badge ${hasLoc?'active':'inactive'}">
                                <span class="status-dot ${hasLoc?'green':'gray'}"></span>
                                ${hasLoc ? 'محدد' : 'غير محدد'}
                            </span>
                        </div>
                        <div class="row" style="justify-content:flex-start;gap:12px;font-size:13px;color:var(--text-muted);">
                            <span><i class="fas fa-phone"></i> ${esc(p.phone||'-')}</span>
                            <span><i class="fas fa-flag"></i> ${esc(p.nationality||'-')}</span>
                            <span><i class="far fa-calendar"></i> ${date}</span>
                        </div>
                        <div class="actions">
                            <button class="loc-btn" onclick="openLocationModal('${p.id}','${esc(p.name)}')"><i class="fas fa-map-pin"></i> موقع</button>
                            ${hasLoc ? `<button class="google-btn" onclick="openInGoogleMapsDirect(${p.latitude},${p.longitude})"><i class="fas fa-map"></i> خرائط</button>` : ''}
                            <button class="edit-btn" onclick="openEditModal('${p.id}','${esc(p.name)}','${esc(p.code)}','${esc(p.phone||'')}','${esc(p.nationality||'')}','${esc(p.user_id||'')}')"><i class="fas fa-edit"></i> تعديل</button>
                            <button class="del-btn" onclick="deletePilgrim('${p.id}','${esc(p.name)}')"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function esc(t) { if(!t) return ''; return String(t).replace(/[&<>"]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[m] || m)); }

        function updateStats(data) {
            document.getElementById('totalPilgrims').textContent = data.length;
            document.getElementById('locatedPilgrims').textContent = data.filter(p=>p.latitude&&p.longitude).length;
            if(data.length && data[0].created_at) {
                document.getElementById('lastAdded').textContent = new Date(data[0].created_at).toLocaleDateString('ar-SA');
            } else {
                document.getElementById('lastAdded').textContent = '-';
            }
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if(!q) return renderCards(allPilgrims);
            renderCards(allPilgrims.filter(p =>
                p.name.toLowerCase().includes(q) ||
                p.code.toLowerCase().includes(q) ||
                (p.phone && p.phone.includes(q)) ||
                (p.nationality && p.nationality.toLowerCase().includes(q))
            ));
        }

        // =================================================================
        // 3. الإضافة والتعديل والحذف
        // =================================================================
        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus"></i> إضافة حاج';
            document.getElementById('editId').value = '';
            ['inputName','inputCode','inputPhone','inputNationality','inputUserId'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('addEditModal').classList.add('show');
        }

        function openEditModal(id, name, code, phone, nationality, userId) {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> تعديل حاج';
            document.getElementById('editId').value = id;
            document.getElementById('inputName').value = name;
            document.getElementById('inputCode').value = code;
            document.getElementById('inputPhone').value = phone;
            document.getElementById('inputNationality').value = nationality;
            document.getElementById('inputUserId').value = userId;
            document.getElementById('addEditModal').classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
            if(id === 'locationModal' && map) { map.remove(); map = null; }
        }

        async function savePilgrim() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('inputName').value.trim();
            const code = document.getElementById('inputCode').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const nationality = document.getElementById('inputNationality').value.trim();
            const userId = document.getElementById('inputUserId').value.trim() || '00000000-0000-0000-0000-000000000000';

            if(!name || !code) { showToast('⚠️ الاسم والكود مطلوبان', true); return; }

            const payload = { name, code, phone, nationality, user_id: userId };
            try {
                let result;
                if(id) { result = await supabase.from('pilgrims').update(payload).eq('id', id); }
                else { result = await supabase.from('pilgrims').insert([payload]); }
                if(result.error) throw new Error(result.error.message);
                showToast(id ? '✅ تم التعديل' : '✅ تم الإضافة');
                closeModal('addEditModal');
                loadPilgrims();
            } catch(e) { showToast('❌ ' + e.message, true); }
        }

        async function deletePilgrim(id, name) {
            if(!confirm(`حذف "${name}" نهائياً؟`)) return;
            try {
                const { error } = await supabase.from('pilgrims').delete().eq('id', id);
                if(error) throw new Error(error.message);
                showToast('🗑️ تم حذف ' + name);
                loadPilgrims();
            } catch(e) { showToast('❌ ' + e.message, true); }
        }

        // =================================================================
        // 4. الخريطة – عرض موقع الحاج وزر خرائط جوجل
        // =================================================================
        function openInGoogleMapsDirect(lat, lng) {
            if (lat && lng) {
                window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank');
            }
        }

        function openLocationModal(id, name) {
            currentLocationPilgrimId = id;
            document.getElementById('selectedAddress').textContent = 'جاري تحميل الموقع...';
            document.getElementById('googleMapsBtn').classList.add('disabled');
            document.getElementById('locationModal').classList.add('show');

            setTimeout(() => {
                if (map) map.remove();
                map = L.map('locationMap').setView([21.4225, 39.8262], 6);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);

                supabase.from('pilgrim_locations').select('*').eq('pilgrim_id', id).maybeSingle()
                    .then(({ data }) => {
                        if (data?.latitude && data?.longitude) {
                            const lat = parseFloat(data.latitude);
                            const lng = parseFloat(data.longitude);
                            document.getElementById('locLat').value = lat;
                            document.getElementById('locLng').value = lng;
                            document.getElementById('selectedAddress').textContent = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                            document.getElementById('googleMapsBtn').classList.remove('disabled');
                            map.setView([lat, lng], 15);
                            marker = L.marker([lat, lng], {
                                icon: L.divIcon({
                                    className: 'custom-marker',
                                    html: '<i class="fas fa-user-circle" style="font-size:36px;color:#075c52;"></i>',
                                    iconSize: [36, 36],
                                    iconAnchor: [18, 36]
                                })
                            }).addTo(map);
                            L.circle([lat, lng], { color: '#c99625', fillColor: '#c99625', fillOpacity: 0.1, radius: 40 }).addTo(map);
                        } else {
                            document.getElementById('selectedAddress').textContent = '⚠️ لم يحدد الموقع بعد';
                        }
                    });

                map.on('click', function(e) {
                    const lat = e.latlng.lat;
                    const lng = e.latlng.lng;
                    document.getElementById('locLat').value = lat.toFixed(6);
                    document.getElementById('locLng').value = lng.toFixed(6);
                    document.getElementById('selectedAddress').textContent = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    document.getElementById('googleMapsBtn').classList.remove('disabled');
                    if (marker) map.removeLayer(marker);
                    marker = L.marker([lat, lng]).addTo(map);
                });

                // حفظ الإحداثيات في متغيرات عامة
                window._tempLat = null;
                window._tempLng = null;
                map.on('click', function(e) {
                    window._tempLat = e.latlng.lat;
                    window._tempLng = e.latlng.lng;
                });

            }, 300);
        }

        async function saveLocation() {
            const lat = parseFloat(document.getElementById('locLat').value);
            const lng = parseFloat(document.getElementById('locLng').value);
            if(isNaN(lat)||isNaN(lng)) { showToast('⚠️ اختر موقعاً على الخريطة', true); return; }
            if(!currentLocationPilgrimId) { showToast('⚠️ خطأ', true); return; }
            try {
                const { error } = await supabase.from('pilgrim_locations').upsert({
                    pilgrim_id: currentLocationPilgrimId,
                    latitude: lat, longitude: lng,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'pilgrim_id' });
                if(error) throw new Error(error.message);
                showToast('✅ تم حفظ الموقع');
                closeModal('locationModal');
                loadPilgrims();
            } catch(e) { showToast('❌ ' + e.message, true); }
        }

        function openInGoogleMaps() {
            const lat = parseFloat(document.getElementById('locLat').value);
            const lng = parseFloat(document.getElementById('locLng').value);
            if(!lat || !lng) { showToast('⚠️ لا يوجد موقع', true); return; }
            window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank');
        }

        function searchLocation() {
            const query = document.getElementById('mapSearchInput').value.trim();
            if (!query) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`)
                .then(res => res.json())
                .then(data => {
                    if (data?.length > 0) {
                        const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
                        if (map) {
                            map.setView([lat, lng], 14);
                            if (marker) map.removeLayer(marker);
                            marker = L.marker([lat, lng]).addTo(map);
                            document.getElementById('locLat').value = lat.toFixed(6);
                            document.getElementById('locLng').value = lng.toFixed(6);
                            document.getElementById('selectedAddress').textContent = `📍 ${data[0].display_name}`;
                        }
                    } else { showToast('⚠️ لم يتم العثور', true); }
                }).catch(() => showToast('❌ خطأ في البحث', true));
        }

        // =================================================================
        // 5. تصدير CSV
        // =================================================================
        function exportCSV() {
            if(!allPilgrims?.length) { showToast('لا توجد بيانات', true); return; }
            let csv = "الاسم,الكود,الهاتف,الجنسية,المعرف,التاريخ,الموقع\n";
            allPilgrims.forEach(p => {
                csv += `"${p.name}","${p.code}","${p.phone||''}","${p.nationality||''}","${p.user_id||''}","${p.created_at?new Date(p.created_at).toLocaleDateString('ar-SA'):''}","${p.latitude&&p.longitude?'محدد':'غير محدد'}"\n`;
            });
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `الحجاج_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            showToast('📥 تم التصدير');
        }

        // =================================================================
        // 6. التشغيل
        // =================================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadPilgrims();
            console.log('✅ لوحة إدارة حديثة (بدون شريط جانبي - بطاقات)');
        });
    </script>
</body>
</html>
